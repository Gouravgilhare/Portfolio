services:
  app:
    build:
      context: .  # Dockerfile is in root
      dockerfile: Dockerfile
    container_name: portfolio-app
    env_file:
      - .env
    networks:
      - portfolio-network

  nginx:
    image: nginx:latest
    container_name: portfolio-nginx
    ports:
      - "80:80"
    volumes:
      - ./Backend/dist:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge

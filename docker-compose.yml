version: "3.9"

services:
  app:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: portfolio-app
    env_file:
      - .env
    networks:
      - portfolio-network

  nginx:
    image: nginx:latest
    container_name: portfolio-nginx
    ports:
      - "80:80"   # Host port 80 → container port 80
    volumes:
      - ./dist:/usr/share/nginx/html  # React static files
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge

version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-app
    env_file:
      - .env
    ports:
      - "8080:8080"       # optional, for direct access
    networks:
      - portfolio-network
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: portfolio-nginx
    ports:
      - "80:80"
    volumes:
      - ./dist:/usr/share/nginx/html           # React build
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro  # site config
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro            # global config
    depends_on:
      - app
    networks:
      - portfolio-network
    restart: unless-stopped

networks:
  portfolio-network:
    driver: bridge
